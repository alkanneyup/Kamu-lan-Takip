name: Kamu İlan Takip

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  takip:
    runs-on: ubuntu-latest

    steps:

      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereksinimleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: İlanları tara
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== ÇALIŞMA DİZİNİ ==="
          pwd

          echo "=== DOSYALAR ==="
          ls -la

          echo "=== MAIN.PY KONTROL ==="
          test -f main.py
          wc -l main.py

          echo "=== MAIN.PY İLK 15 SATIR ==="
          head -n 15 main.py

          echo "=== PYTHON ==="
          python --version

          echo "=== MAIN.PY BAŞLATILIYOR ==="
          python -u main.py

      - name: Gönderilen ilanları kaydet
        run: |
          git config user.name "Kamu İlan Takip Botu"
          git config user.email "actions@github.com"

          git add sent_ids.json

          git diff --cached --quiet || \
          git commit -m "İlan takip verisini güncelle"

          git push
