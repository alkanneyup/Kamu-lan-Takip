name: Kamu İlan Takip Otomasyonu

on:
  schedule:
    # Her saat başı çalışması için cron zamanlaması
    - cron: '0 * * * *'
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Kopyala (Checkout)
      uses: actions/checkout@v3

    - name: Python Ortamını Kur
      uses: actions/setup-python@v4
      with:
        python-python-version: '3.11'

    # --- EKLENECEK KISIM BURASI ---
    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 python-telegram-bot
    # -------------------------------

    - name: Otomasyon Kodunu Çalıştır
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py

      - name: Veri Durumunu (sent_ids.json) Güncelle ve Commit Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_ids.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: otomatik durum güncellemesi [skip ci]" && \
            git pull --rebase origin main && \
            git push
          )
