name: Kamu İlan Takip

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  takip:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereksinimleri kur
        run: pip install -r requirements.txt

      - name: İlanları tara
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Gönderilen ilanları kaydet
        run: |
          git config user.name "Kamu İlan Takip Botu"
          git config user.email "actions@github.com"
          git add sent_ids.json
          git diff --cached --quiet || git commit -m "İlan takip verisini güncelle"
          git push
