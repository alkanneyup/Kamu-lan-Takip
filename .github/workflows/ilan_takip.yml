name: takip

on:
  schedule:
    - cron: '0 6 * * *' # Her gün TSİ 09:00'da çalışır (UTC 06:00)
  workflow_dispatch:   # Manuel çalıştırma butonu

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scripti Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Gönderilen İlanları Kaydet (sent_ids.json)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sent_ids.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Update sent_ids.json" && git push)
          
